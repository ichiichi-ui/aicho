// ---------- depreciation ----------
function straightLineDepreciation(cost, salvage, usefulLifeYears){
  const total = Math.max(0, cost - salvage);
  const annual = usefulLifeYears>0 ? Math.floor(total/usefulLifeYears) : 0;
  return annual;
}

function renderDepreciation(el){
  if(!state.fixedAssets) state.fixedAssets = [];
  const dySelectedYear = renderDepreciation._year || String(new Date().getFullYear());
  const years = Array.from(new Set([
    ...state.fixedAssets.map(a=>a.acquisitionDate ? a.acquisitionDate.slice(0,4) : ''),
    String(new Date().getFullYear())
  ].filter(Boolean))).sort().reverse();
  if(!years.includes(dySelectedYear)) years.unshift(dySelectedYear);

  el.innerHTML = `
    <h2 class="section-title">減価償却 <span class="en">DEPRECIATION</span></h2>
    <p class="section-desc">
      固定資産（パソコン・車両・工具器具備品など）を登録すると、定額法で年ごとの減価償却費と期末帳簿価額を自動計算します（簡易計算です。実際の耐用年数・償却方法は国税庁の耐用年数表に従い、税理士等にご確認ください）。
    </p>
    <div class="field-row" style="max-width:200px;">
      <label>対象年</label>
      <select id="dyYearSelect">${years.map(y=>`<option value="${y}" ${y===dySelectedYear?'selected':''}>${y}年</option>`).join('')}</select>
    </div>
    <div id="dyList"></div>

    <h3 class="serif" style="font-size:15px;color:var(--ai);margin:22px 0 8px;">固定資産を追加</h3>
    <div class="two-col">
      <div class="field-row"><label>資産名</label><input type="text" id="faNameInput" placeholder="例：ノートパソコン"></div>
      <div class="field-row"><label>取得日</label><input type="date" id="faDateInput"></div>
    </div>
    <div class="two-col">
      <div class="field-row"><label>取得価額</label><input type="number" id="faCostInput" placeholder="0"></div>
      <div class="field-row"><label>耐用年数（年）</label><input type="number" id="faLifeInput" placeholder="例：4"></div>
    </div>
    <div class="field-row" style="max-width:260px;">
      <label>残存価額（通常は0）</label>
      <input type="number" id="faSalvageInput" value="0">
    </div>
    <button class="btn btn-primary" id="faAddBtn">追加</button>
  `;

  document.getElementById('dyYearSelect').onchange = (e)=>{
    renderDepreciation._year = e.target.value;
    renderDyList();
  };

  function renderDyList(){
    const year = renderDepreciation._year || dySelectedYear;
    const wrap = document.getElementById('dyList');
    if(state.fixedAssets.length===0){
      wrap.innerHTML = `<div class="empty-state"><div class="mark">— 固定資産が登録されていません —</div></div>`;
      return;
    }
    const rows = state.fixedAssets.map(a=>{
      const annual = straightLineDepreciation(a.cost, a.salvage||0, a.usefulLife);
      const acqYear = a.acquisitionDate ? parseInt(a.acquisitionDate.slice(0,4)) : parseInt(year);
      const targetYear = parseInt(year);
      const elapsedYears = Math.max(0, targetYear - acqYear + 1);
      const accumulated = Math.min(Math.max(0, a.cost - (a.salvage||0)), annual * elapsedYears);
      const bookValueStart = Math.max(a.salvage||0, a.cost - annual*(elapsedYears-1));
      const bookValueEnd = Math.max(a.salvage||0, a.cost - accumulated);
      const inService = targetYear >= acqYear;
      return { a, annual, bookValueStart, bookValueEnd, inService };
    });
    wrap.innerHTML = `
      <table>
        <thead><tr><th>資産名</th><th>取得価額</th><th>年間償却額</th><th>期末帳簿価額</th><th></th></tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr data-id="${r.a.id}">
              <td>${r.a.name}</td>
              <td style="text-align:right" class="num">${fmtYen(r.a.cost)}</td>
              <td style="text-align:right" class="num">${r.inService ? fmtYen(r.annual) : '—'}</td>
              <td style="text-align:right" class="num">${r.inService ? fmtYen(r.bookValueEnd) : fmtYen(r.a.cost)}</td>
              <td><button class="btn-danger fa-del">削除</button></td>
            </tr>
          `).join('')}
          <tr style="font-weight:700">
            <td>合計</td><td></td>
            <td style="text-align:right" class="num">${fmtYen(rows.filter(r=>r.inService).reduce((s,r)=>s+r.annual,0))}</td>
            <td style="text-align:right" class="num">${fmtYen(rows.reduce((s,r)=>s+(r.inService?r.bookValueEnd:r.a.cost),0))}</td>
            <td></td>
          </tr>
        </tbody>
      </table>
    `;
    wrap.querySelectorAll('.fa-del').forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.closest('tr').dataset.id;
        state.fixedAssets = state.fixedAssets.filter(a=>a.id!==id);
        saveState(true); renderDyList();
      };
    });
  }
  renderDyList();

  document.getElementById('faAddBtn').onclick = ()=>{
    const name = document.getElementById('faNameInput').value.trim();
    const acquisitionDate = document.getElementById('faDateInput').value;
    const cost = parseFloat(document.getElementById('faCostInput').value)||0;
    const usefulLife = parseFloat(document.getElementById('faLifeInput').value)||0;
    const salvage = parseFloat(document.getElementById('faSalvageInput').value)||0;
    if(!name || !cost || !usefulLife){ doToast('資産名・取得価額・耐用年数を入力してください'); return; }
    state.fixedAssets.push({ id: uid(), name, acquisitionDate, cost, usefulLife, salvage });
    saveState(true);
    ['faNameInput','faDateInput','faCostInput','faLifeInput'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('faSalvageInput').value = '0';
    renderDyList();
  };
}

// ---------- receipt (OCR) import ----------
let receiptOcrState = { imageDataUrl: null, extractedText: '', rawFile: null };

function renderReceipt(el){
  el.innerHTML = `
    <h2 class="section-title">レシート取込 <span class="en">RECEIPT OCR</span></h2>
    <p class="section-desc">
      レシートや領収書の写真から、日付・金額・店名などの文字を読み取り、記帳の下書きを作成します。読み取り結果は必ず内容を確認・修正してから記帳してください（完全自動ではありません）。<br>
      他アプリで文字起こし済みのテキストがあれば、そのまま貼り付けて使うこともできます。
    </p>
    <div class="field-row">
      <label>レシートの写真を選択（カメラ撮影も可）</label>
      <input type="file" accept="image/*" capture="environment" id="receiptFileInput">
    </div>
    <div id="receiptPreview"></div>
    <div class="field-row" style="margin-top:12px;">
      <label>読み取り結果／他アプリのテキストを貼り付け</label>
      <textarea id="receiptTextArea" rows="4" placeholder="例：2026-07-15 〇〇商店 文房具 ¥1,200" style="width:100%;box-sizing:border-box;padding:8px;font-size:13px;"></textarea>
    </div>
    <button class="btn btn-secondary" id="receiptOcrBtn">この画像から文字を読み取る（AI補正）</button>
    <div id="receiptOcrStatus" style="font-size:12px;color:var(--sumi-soft);margin-top:6px;"></div>

    <h3 class="serif" style="font-size:15px;color:var(--ai);margin:22px 0 8px;">記帳内容の確認</h3>
    <div class="two-col">
      <div class="field-row"><label>日付</label><input type="date" id="rcpDateInput"></div>
      <div class="field-row"><label>金額</label><input type="number" id="rcpAmountInput" placeholder="0"></div>
    </div>
    <div class="field-row"><label>摘要（店名・商品名など）</label><input type="text" id="rcpMemoInput" placeholder="例：〇〇商店 文房具"></div>
    <div class="two-col">
      <div class="field-row"><label>借方科目（費用など）</label><select id="rcpDebitSelect">${accOptions(a=>a.category!=='equity')}</select></div>
      <div class="field-row"><label>貸方科目（支払元）</label><select id="rcpCreditSelect">${accOptions(a=>a.category==='asset'||a.category==='liability')}</select></div>
    </div>
    <button class="btn btn-primary" id="rcpSubmitBtn">この内容で記帳する</button>
    <p style="font-size:11px;color:var(--sumi-soft);margin-top:10px;">摘要に含めたキーワードは、CSV取込と同様に次回以降の科目提案に使われます。</p>
  `;

  document.getElementById('receiptFileInput').onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    receiptOcrState.rawFile = file;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      receiptOcrState.imageDataUrl = ev.target.result;
      document.getElementById('receiptPreview').innerHTML = `<img src="${ev.target.result}" style="max-width:100%;border-radius:8px;margin-top:8px;">`;
    };
    reader.readAsDataURL(file);
  };

  document.getElementById('receiptOcrBtn').onclick = async ()=>{
    const statusEl = document.getElementById('receiptOcrStatus');
    if(!receiptOcrState.rawFile){ statusEl.textContent = '先に画像を選択してください'; return; }
    if(typeof Tesseract === 'undefined'){ statusEl.textContent = '文字認識ライブラリの読み込みに失敗しました。しばらくしてから再度お試しください。'; return; }
    statusEl.textContent = '読み取り中…（数秒〜数十秒かかることがあります）';
    try{
      const result = await Tesseract.recognize(receiptOcrState.imageDataUrl, 'jpn+eng');
      let text = result.data.text || '';
      // 簡易AI補正：全角数字→半角、余分な空白の整理
      text = text.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0xFEE0));
      text = text.replace(/[ \t]+/g,' ').trim();
      receiptOcrState.extractedText = text;
      document.getElementById('receiptTextArea').value = text;
      autofillFromReceiptText(text);
      statusEl.textContent = '読み取りが完了しました。内容を確認・修正してください。';
    }catch(err){
      statusEl.textContent = '読み取りに失敗しました。手動で入力してください。';
    }
  };

  document.getElementById('receiptTextArea').oninput = (e)=>{
    autofillFromReceiptText(e.target.value);
  };

  function autofillFromReceiptText(text){
    // 日付らしき文字列
    const dateMatch = text.match(/(20\d{2})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
    if(dateMatch){
      const d = `${dateMatch[1]}-${String(dateMatch[2]).padStart(2,'0')}-${String(dateMatch[3]).padStart(2,'0')}`;
      document.getElementById('rcpDateInput').value = d;
    }
    // 金額らしき文字列（¥や円、カンマ区切りの数字のうち最大のもの）
    const amounts = Array.from(text.matchAll(/[¥￥]?\s?([\d,]{3,})\s?円?/g)).map(m=>parseInt(m[1].replace(/,/g,''))).filter(n=>!isNaN(n));
    if(amounts.length){
      document.getElementById('rcpAmountInput').value = Math.max(...amounts);
    }
    // 摘要：先頭の日付・金額らしき行を除いた最初の行
    const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
    const memoLine = lines.find(l => !/^\d/.test(l) && l.length>=2) || '';
    if(memoLine){
      document.getElementById('rcpMemoInput').value = memoLine.slice(0,30);
      const guessed = guessAccountForMemo(memoLine);
      if(guessed) document.getElementById('rcpDebitSelect').value = guessed;
    }
  }

  document.getElementById('rcpSubmitBtn').onclick = ()=>{
    const date = document.getElementById('rcpDateInput').value;
    const amount = parseFloat(document.getElementById('rcpAmountInput').value);
    const memo = document.getElementById('rcpMemoInput').value.trim();
    const debitId = document.getElementById('rcpDebitSelect').value;
    const creditId = document.getElementById('rcpCreditSelect').value;
    if(!date || !amount || !debitId || !creditId){ doToast('日付・金額・科目を確認してください'); return; }
    state.transactions.push({
      id: uid(), date, debitAccountId:debitId, creditAccountId:creditId, amount, memo, type:'receipt',
      taxCategory:'none', taxRate:0, taxAmount:0, netAmount:amount
    });
    if(memo){
      const key = memo.slice(0,8);
      const existing = state.csvRules.find(r=>r.keyword===key);
      if(existing) existing.accountId = debitId;
      else state.csvRules.push({keyword:key, accountId:debitId});
    }
    saveState(true);
    doToast('記帳しました');
    receiptOcrState = { imageDataUrl:null, extractedText:'', rawFile:null };
    render();
  };
}

// ---------- data analysis ----------
let analysisState = { chartType: 'bar', metric: 'expense', year: String(new Date().getFullYear()) };

function renderAnalysis(el){
  const years = Array.from(new Set(state.transactions.map(t=>t.date.slice(0,4)))).sort().reverse();
  if(years.length===0) years.push(String(new Date().getFullYear()));
  if(!years.includes(analysisState.year)) analysisState.year = years[0];

  el.innerHTML = `
    <h2 class="section-title">データ分析 <span class="en">ANALYSIS</span></h2>
    <p class="section-desc">記帳データをグラフや推移表で確認できます。</p>
    <div class="two-col">
      <div class="field-row">
        <label>グラフの種類</label>
        <select id="anChartType">
          <option value="bar" ${analysisState.chartType==='bar'?'selected':''}>棒グラフ</option>
          <option value="pie" ${analysisState.chartType==='pie'?'selected':''}>円グラフ</option>
          <option value="line" ${analysisState.chartType==='line'?'selected':''}>折れ線グラフ（月次推移）</option>
        </select>
      </div>
      <div class="field-row">
        <label>対象</label>
        <select id="anMetric">
          <option value="expense" ${analysisState.metric==='expense'?'selected':''}>費用（科目別）</option>
          <option value="revenue" ${analysisState.metric==='revenue'?'selected':''}>収益（科目別）</option>
        </select>
      </div>
    </div>
    <div class="field-row" style="max-width:200px;">
      <label>対象年</label>
      <select id="anYearSelect">${years.map(y=>`<option value="${y}" ${y===analysisState.year?'selected':''}>${y}年</option>`).join('')}</select>
    </div>
    <div style="margin-top:14px;background:#fff;border-radius:10px;padding:10px;">
      <canvas id="anCanvas" style="width:100%;max-width:100%;"></canvas>
    </div>
    <div id="anTable" style="margin-top:16px;"></div>
    <button class="btn btn-secondary" id="anExportBtn" style="margin-top:10px;">推移表をCSVで書き出す</button>
    <button class="btn btn-secondary" id="anExportExcelBtn" style="margin-top:10px;margin-left:8px;">グラフ付きExcelで書き出す</button>
    <div id="anExcelStatus" style="font-size:11px;color:var(--sumi-soft);margin-top:6px;"></div>
  `;

  ['anChartType','anMetric','anYearSelect'].forEach(id=>{
    document.getElementById(id).onchange = ()=>{
      analysisState.chartType = document.getElementById('anChartType').value;
      analysisState.metric = document.getElementById('anMetric').value;
      analysisState.year = document.getElementById('anYearSelect').value;
      drawAnalysis();
    };
  });

  function getMonthlyByAccount(){
    const cat = analysisState.metric; // 'expense' or 'revenue'
    const accs = state.accounts.filter(a=>a.category===cat);
    const year = analysisState.year;
    const data = {}; // accName -> [12 months]
    accs.forEach(a=>{ data[a.name] = new Array(12).fill(0); });
    state.transactions.forEach(t=>{
      if(t.date.slice(0,4)!==year) return;
      const month = parseInt(t.date.slice(5,7))-1;
      const net = (t.netAmount!==undefined)?t.netAmount:t.amount;
      if(cat==='expense' && accs.find(a=>a.id===t.debitAccountId)){
        const acc = accs.find(a=>a.id===t.debitAccountId);
        data[acc.name][month] += net;
      }
      if(cat==='revenue' && accs.find(a=>a.id===t.creditAccountId)){
        const acc = accs.find(a=>a.id===t.creditAccountId);
        data[acc.name][month] += net;
      }
    });
    return data;
  }

  function drawAnalysis(){
    const canvas = document.getElementById('anCanvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.parentElement.clientWidth - 20;
    const cssHeight = 260;
    canvas.width = cssWidth*dpr; canvas.height = cssHeight*dpr;
    canvas.style.width = cssWidth+'px'; canvas.style.height = cssHeight+'px';
    ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,cssWidth,cssHeight);

    const monthly = getMonthlyByAccount();
    const totals = Object.entries(monthly).map(([name,arr])=>[name, arr.reduce((s,v)=>s+v,0)]).filter(([,v])=>v>0);
    const colors = ['#1f3a5f','#a63446','#5b7553','#b8935f','#6b6258','#2d4d78','#8a6a3a','#7a8f72'];

    const tableWrap = document.getElementById('anTable');

    if(totals.length===0){
      ctx.fillStyle = '#6b6258'; ctx.font='13px sans-serif';
      ctx.fillText('この年のデータがありません', 10, 30);
      tableWrap.innerHTML = '';
      return;
    }

    if(analysisState.chartType==='pie'){
      const total = totals.reduce((s,[,v])=>s+v,0);
      let angle = -Math.PI/2;
      const cx = cssWidth/2, cy = cssHeight/2, r = Math.min(cx,cy)-20;
      totals.forEach(([name,v],i)=>{
        const slice = (v/total)*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,angle,angle+slice);
        ctx.closePath();
        ctx.fillStyle = colors[i%colors.length];
        ctx.fill();
        angle += slice;
      });
    } else if(analysisState.chartType==='bar'){
      const maxV = Math.max(...totals.map(([,v])=>v));
      const barW = Math.min(50, (cssWidth-40)/totals.length - 10);
      const left = 40;
      totals.forEach(([name,v],i)=>{
        const h = maxV>0 ? (v/maxV)*(cssHeight-50) : 0;
        const x = left + i*(barW+14);
        ctx.fillStyle = colors[i%colors.length];
        ctx.fillRect(x, cssHeight-30-h, barW, h);
        ctx.fillStyle = '#2b2620'; ctx.font='9px sans-serif';
        ctx.save();
        ctx.translate(x+barW/2, cssHeight-14);
        ctx.rotate(-Math.PI/6);
        ctx.fillText(name.slice(0,6), 0, 0);
        ctx.restore();
      });
    } else if(analysisState.chartType==='line'){
      const maxV = Math.max(...totals.map(([name])=>Math.max(...monthly[name])), 1);
      const left = 30, right = cssWidth-10, top = 15, bottom = cssHeight-30;
      const stepX = (right-left)/11;
      totals.slice(0,6).forEach(([name],i)=>{
        ctx.strokeStyle = colors[i%colors.length];
        ctx.beginPath();
        monthly[name].forEach((v,m)=>{
          const x = left+m*stepX;
          const y = bottom - (v/maxV)*(bottom-top);
          if(m===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        });
        ctx.stroke();
      });
      ctx.fillStyle = '#6b6258'; ctx.font='9px sans-serif';
      for(let m=0;m<12;m+=2){
        ctx.fillText((m+1)+'月', left+m*stepX-6, cssHeight-14);
      }
    }

    tableWrap.innerHTML = `
      <table>
        <thead><tr><th>科目</th><th>年間合計</th></tr></thead>
        <tbody>${totals.sort((a,b)=>b[1]-a[1]).map(([name,v])=>`<tr><td>${name}</td><td style="text-align:right" class="num">${fmtYen(v)}</td></tr>`).join('')}</tbody>
      </table>
    `;
  }

  document.getElementById('anExportBtn').onclick = ()=>{
    const monthly = getMonthlyByAccount();
    const rows = [['科目', ...Array.from({length:12},(_,i)=>(i+1)+'月'), '合計']];
    Object.entries(monthly).forEach(([name,arr])=>{
      const total = arr.reduce((s,v)=>s+v,0);
      if(total===0) return;
      rows.push([name, ...arr, total]);
    });
    const csv = rows.map(r=>r.join(',')).join('\n');
    const blob = new Blob(["\uFEFF"+csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `藍帳_推移表_${analysisState.year}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  document.getElementById('anExportExcelBtn').onclick = async ()=>{
    const statusEl = document.getElementById('anExcelStatus');
    if(typeof XLSX === 'undefined' || typeof JSZip === 'undefined'){
      statusEl.textContent = 'Excel書き出し機能の読み込みに失敗しました。しばらくしてから再度お試しください。';
      return;
    }
    const monthly = getMonthlyByAccount();
    let labels, values, seriesName, title;
    if(analysisState.chartType==='line'){
      labels = Array.from({length:12},(_,i)=>(i+1)+'月');
      values = Array.from({length:12},(_,m)=> Object.values(monthly).reduce((s,arr)=>s+arr[m],0));
      seriesName = analysisState.metric==='expense' ? '費用合計' : '収益合計';
      title = `${analysisState.year}年 月次推移（${seriesName}）`;
    } else {
      const totals = Object.entries(monthly).map(([name,arr])=>[name, arr.reduce((s,v)=>s+v,0)]).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
      labels = totals.map(t=>t[0]);
      values = totals.map(t=>t[1]);
      seriesName = analysisState.metric==='expense' ? '費用' : '収益';
      title = `${analysisState.year}年 ${seriesName}（科目別）`;
    }
    if(labels.length===0){ statusEl.textContent = 'この年のデータがありません'; return; }
    statusEl.textContent = '作成中…';
    try{
      const blob = await generateExcelWithChart(labels, values, seriesName, title, analysisState.chartType);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `藍帳_グラフ_${analysisState.year}.xlsx`;
      a.click();
      URL.revokeObjectURL(url);
      statusEl.textContent = '書き出しました。Excel/スプレッドシートアプリで開くと、データとグラフの両方が入っています。';
    }catch(e){
      statusEl.textContent = 'Excelファイルの作成に失敗しました。CSV書き出しをお試しください。';
    }
  };

  drawAnalysis();
}

// ---------- excel with embedded chart ----------
function escapeXml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function generateExcelWithChart(labels, values, seriesName, title, chartType){
  const wsData = [['科目', seriesName], ...labels.map((l,i)=>[l, values[i]])];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  const wbArray = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  const zip = await JSZip.loadAsync(wbArray);

  const n = labels.length;
  const lastRow = n + 1;
  const catPts = labels.map((l,i)=>`<c:pt idx="${i}"><c:v>${escapeXml(l)}</c:v></c:pt>`).join('');
  const valPts = values.map((v,i)=>`<c:pt idx="${i}"><c:v>${v}</c:v></c:pt>`).join('');

  const serXml = `
    <c:ser>
      <c:idx val="0"/>
      <c:order val="0"/>
      <c:tx><c:strRef><c:f>Sheet1!$B$1</c:f><c:strCache><c:ptCount val="1"/><c:pt idx="0"><c:v>${escapeXml(seriesName)}</c:v></c:pt></c:strCache></c:strRef></c:tx>
      <c:cat><c:strRef><c:f>Sheet1!$A$2:$A$${lastRow}</c:f><c:strCache><c:ptCount val="${n}"/>${catPts}</c:strCache></c:strRef></c:cat>
      <c:val><c:numRef><c:f>Sheet1!$B$2:$B$${lastRow}</c:f><c:numCache><c:formatCode>General</c:formatCode><c:ptCount val="${n}"/>${valPts}</c:numCache></c:numRef></c:val>
    </c:ser>`;

  let chartBody;
  if(chartType==='pie'){
    chartBody = `<c:pieChart><c:varyColors val="1"/>${serXml}</c:pieChart>`;
  } else if(chartType==='line'){
    chartBody = `<c:lineChart><c:grouping val="standard"/>${serXml}<c:marker val="1"/><c:axId val="111111111"/><c:axId val="222222222"/></c:lineChart>`;
  } else {
    chartBody = `<c:barChart><c:barDir val="col"/><c:grouping val="clustered"/>${serXml}<c:axId val="111111111"/><c:axId val="222222222"/></c:barChart>`;
  }

  const axesXml = (chartType==='pie') ? '' : `
    <c:catAx><c:axId val="111111111"/><c:scaling><c:orientation val="minMax"/></c:scaling><c:delete val="0"/><c:axPos val="b"/><c:crossAx val="222222222"/></c:catAx>
    <c:valAx><c:axId val="222222222"/><c:scaling><c:orientation val="minMax"/></c:scaling><c:delete val="0"/><c:axPos val="l"/><c:crossAx val="111111111"/></c:valAx>`;

  const chartXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<c:chartSpace xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <c:chart>
    <c:title><c:tx><c:rich><a:bodyPr/><a:lstStyle/><a:p><a:r><a:t>${escapeXml(title)}</a:t></a:r></a:p></c:rich></c:tx></c:title>
    <c:autoTitleDeleted val="0"/>
    <c:plotArea><c:layout/>${chartBody}${axesXml}</c:plotArea>
    <c:plotVisOnly val="1"/>
  </c:chart>
</c:chartSpace>`;

  const drawingXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <xdr:twoCellAnchor>
    <xdr:from><xdr:col>3</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>1</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from>
    <xdr:to><xdr:col>14</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>22</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to>
    <xdr:graphicFrame macro="">
      <xdr:nvGraphicFramePr><xdr:cNvPr id="2" name="Chart 1"/><xdr:cNvGraphicFramePr/></xdr:nvGraphicFramePr>
      <xdr:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/></xdr:xfrm>
      <a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/chart"><c:chart xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:id="rId1"/></a:graphicData></a:graphic>
    </xdr:graphicFrame>
    <xdr:clientData/>
  </xdr:twoCellAnchor>
</xdr:wsDr>`;

  const drawingRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="../charts/chart1.xml"/>
</Relationships>`;

  const sheetRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing1.xml"/>
</Relationships>`;

  zip.file('xl/charts/chart1.xml', chartXml);
  zip.file('xl/drawings/drawing1.xml', drawingXml);
  zip.file('xl/drawings/_rels/drawing1.xml.rels', drawingRels);
  zip.file('xl/worksheets/_rels/sheet1.xml.rels', sheetRels);

  let ct = await zip.file('[Content_Types].xml').async('string');
  if(!ct.includes('chart1.xml')){
    ct = ct.replace('</Types>',
      '<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>' +
      '<Override PartName="/xl/charts/chart1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/></Types>');
  }
  zip.file('[Content_Types].xml', ct);

  let sheetXml = await zip.file('xl/worksheets/sheet1.xml').async('string');
  if(!sheetXml.includes('<drawing ')){
    if(!sheetXml.includes('xmlns:r=')){
      sheetXml = sheetXml.replace('<worksheet ', '<worksheet xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ');
    }
    sheetXml = sheetXml.replace('</worksheet>', '<drawing r:id="rId1"/></worksheet>');
  }
  zip.file('xl/worksheets/sheet1.xml', sheetXml);

  return await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

// ---------- print ----------
function renderPrint(el){
  el.innerHTML = `
    <h2 class="section-title">印刷 <span class="en">PRINT</span></h2>
    <p class="section-desc">帳票をブラウザの印刷機能でPDF保存・印刷できます。印刷したい帳票を選んでください。</p>
    <div class="two-col">
      <div class="field-row">
        <label>帳票の種類</label>
        <select id="printKindSelect">
          <option value="journal">仕訳帳</option>
          <option value="ledger">総勘定元帳（科目別）</option>
          <option value="trial">試算表</option>
          <option value="bs">貸借対照表</option>
        </select>
      </div>
      <div class="field-row" id="printAccountWrap" style="display:none;">
        <label>勘定科目</label>
        <select id="printAccountSelect">${accOptions(()=>true)}</select>
      </div>
    </div>
    <button class="btn btn-primary" id="printGoBtn">印刷プレビューを開く</button>
    <p style="font-size:11px;color:var(--sumi-soft);margin-top:10px;">「印刷プレビューを開く」を押すと、端末の印刷メニューが開きます。そこから「PDFとして保存」を選べば、PDFファイルとしても保存できます。</p>
  `;
  document.getElementById('printKindSelect').onchange = (e)=>{
    document.getElementById('printAccountWrap').style.display = e.target.value==='ledger' ? '' : 'none';
  };
  document.getElementById('printGoBtn').onclick = ()=>{
    const kind = document.getElementById('printKindSelect').value;
    let title = '', bodyHtml = '';
    if(kind==='journal'){
      title = '仕訳帳';
      const rows = state.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date));
      bodyHtml = `<table border="1" cellspacing="0" cellpadding="4" style="width:100%;border-collapse:collapse;font-size:12px;">
        <tr><th>日付</th><th>借方</th><th>貸方</th><th>金額</th><th>摘要</th></tr>
        ${rows.map(t=>`<tr><td>${t.date}</td><td>${(accountById(t.debitAccountId)||{}).name||''}</td><td>${(accountById(t.creditAccountId)||{}).name||''}</td><td style="text-align:right">${fmtYen(t.amount)}</td><td>${t.memo||''}</td></tr>`).join('')}
      </table>`;
    } else if(kind==='ledger'){
      const accId = document.getElementById('printAccountSelect').value;
      const acc = accountById(accId);
      title = `総勘定元帳（${acc?acc.name:''}）`;
      const rows = state.transactions.filter(t=>t.debitAccountId===accId||t.creditAccountId===accId).sort((a,b)=>a.date.localeCompare(b.date));
      let bal = acc?(acc.openingBalance||0):0;
      bodyHtml = `<table border="1" cellspacing="0" cellpadding="4" style="width:100%;border-collapse:collapse;font-size:12px;">
        <tr><th>日付</th><th>摘要</th><th>借方</th><th>貸方</th><th>残高</th></tr>
        <tr><td>-</td><td>期首残高</td><td></td><td></td><td style="text-align:right">${fmtYen(bal)}</td></tr>
        ${rows.map(t=>{
          const isDebit = t.debitAccountId===accId;
          const sign = (acc && (acc.category==='asset'||acc.category==='expense')) ? (isDebit?1:-1) : (isDebit?-1:1);
          bal += sign*t.amount;
          return `<tr><td>${t.date}</td><td>${t.memo||''}</td><td style="text-align:right">${isDebit?fmtYen(t.amount):''}</td><td style="text-align:right">${!isDebit?fmtYen(t.amount):''}</td><td style="text-align:right">${fmtYen(bal)}</td></tr>`;
        }).join('')}
      </table>`;
    } else if(kind==='trial'){
      title = '試算表';
      bodyHtml = `<table border="1" cellspacing="0" cellpadding="4" style="width:100%;border-collapse:collapse;font-size:12px;">
        <tr><th>科目</th><th>区分</th><th>借方残高</th><th>貸方残高</th></tr>
        ${state.accounts.map(a=>{
          const bal = accountBalance(a);
          const isDebitNormal = (a.category==='asset'||a.category==='expense');
          const debitBal = isDebitNormal ? Math.max(0,bal) : Math.max(0,-bal);
          const creditBal = isDebitNormal ? Math.max(0,-bal) : Math.max(0,bal);
          return `<tr><td>${a.name}</td><td>${CATEGORY_LABEL[a.category]}</td><td style="text-align:right">${debitBal?fmtYen(debitBal):''}</td><td style="text-align:right">${creditBal?fmtYen(creditBal):''}</td></tr>`;
        }).join('')}
      </table>`;
    } else if(kind==='bs'){
      title = '貸借対照表';
      const assets = state.accounts.filter(a=>a.category==='asset');
      const liabilities = state.accounts.filter(a=>a.category==='liability');
      bodyHtml = `
        <table border="1" cellspacing="0" cellpadding="4" style="width:100%;border-collapse:collapse;font-size:12px;">
          <tr><th>資産の部</th><th>金額</th></tr>
          ${assets.map(a=>`<tr><td>${a.name}</td><td style="text-align:right">${fmtYen(accountBalance(a))}</td></tr>`).join('')}
          <tr><th>負債の部</th><th>金額</th></tr>
          ${liabilities.map(a=>`<tr><td>${a.name}</td><td style="text-align:right">${fmtYen(accountBalance(a))}</td></tr>`).join('')}
        </table>`;
    }
    const win = window.open('', '_blank');
    win.document.write(`<html><head><title>${title}</title><meta charset="UTF-8"></head><body><h2>${title}</h2>${bodyHtml}</body></html>`);
    win.document.close();
    win.print();
  };
}

// ---------- backup (export / import) ----------
function renderBackup(el){
  const dateStr = new Date().toISOString().slice(0,10);
  el.innerHTML = `
    <h2 class="section-title">バックアップ <span class="en">EXPORT / IMPORT</span></h2>
    <p class="section-desc">
      記帳データは、このHTMLファイルを開いているブラウザ（この端末のこのブラウザ）に保存されています。同じファイルを同じブラウザで開き直せば、データはそのまま残っています。<br>
      ただし、別の端末やブラウザで開いた場合、ブラウザのデータを消去した場合は、このデータにはアクセスできません。Google DriveやSamsung（Galaxy）クラウドなどに保存したい場合や、機種変更・バージョンアップの際にデータを引き継ぎたい場合は、以下からデータファイルを書き出し、端末の共有機能でクラウドやメールに保存してください。
    </p>
    <div class="stat-card" style="margin-bottom:18px;">
      <div class="stat-label">データ書き出し（エクスポート）</div>
      <p style="font-size:12.5px;color:var(--sumi-soft);margin:6px 0 12px;">勘定科目・仕訳データすべてを1つのファイルにまとめます。書き出し後、共有メニューからGoogle DriveやGalaxyアプリに保存できます。</p>
      <button class="btn btn-primary" id="exportBtn">バックアップファイルを書き出す</button>
      <button class="btn btn-secondary" id="shareExportBtn" style="margin-left:8px;">メール・共有アプリで送る</button>
      <div id="shareExportStatus" style="font-size:11px;color:var(--sumi-soft);margin-top:6px;"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">データ読み込み（インポート）</div>
      <p style="font-size:12.5px;color:var(--sumi-soft);margin:6px 0 12px;">書き出したファイルを選ぶと、現在のデータを置き換えます（元に戻せません）。</p>
      <input type="file" id="importFile" accept="application/json">
      <div style="margin-top:10px;">
        <button class="btn btn-ghost" id="importBtn">このファイルで復元する</button>
      </div>
    </div>
  `;

  document.getElementById('exportBtn').onclick = ()=>{
    try{
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `aicho-backup-${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=> URL.revokeObjectURL(url), 2000);
      doToast('書き出しました。共有メニューからクラウドに保存できます');
    }catch(e){
      doToast('書き出しに失敗しました');
    }
  };

  document.getElementById('shareExportBtn').onclick = async ()=>{
    const statusEl = document.getElementById('shareExportStatus');
    try{
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      const file = new File([blob], `aicho-backup-${dateStr}.json`, {type:'application/json'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({
          files: [file],
          title: '藍帳バックアップ',
          text: `藍帳のバックアップデータ（${dateStr}）`
        });
        statusEl.textContent = '共有メニューを開きました';
      } else {
        statusEl.textContent = 'この端末・ブラウザでは共有機能が使えません。「バックアップファイルを書き出す」でダウンロードし、メールに手動で添付してください。';
      }
    }catch(e){
      if(e && e.name === 'AbortError') return; // ユーザーがキャンセル
      statusEl.textContent = '共有に失敗しました。「バックアップファイルを書き出す」をお試しください。';
    }
  };

  document.getElementById('importBtn').onclick = ()=>{
    const fileInput = document.getElementById('importFile');
    const file = fileInput.files && fileInput.files[0];
    if(!file){ doToast('ファイルを選択してください'); return; }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!parsed.accounts || !parsed.transactions){ throw new Error('invalid'); }
        state = Object.assign({accounts:[], transactions:[], setupDone:false}, parsed);
        saveState(true);
        render();
        doToast('復元しました');
      }catch(e){
        doToast('ファイルの形式が正しくありません');
      }
    };
    reader.readAsText(file);
  };
}

    <h2 class="section-title">合言葉変更 <span class="en">CHANGE PASSWORD</span></h2>
    <p class="section-desc">
      アプリを開く際の合言葉を変更できます。現在の合言葉の確認は行いませんが、次回このアプリを開く際は新しい合言葉が必要になります。忘れると開けなくなるため、変更後は安全な場所に控えておいてください。
    </p>
    <div class="stat-card" style="max-width:340px;">
      <div class="field-row">
        <label>新しい合言葉（4文字以上）</label>
        <div style="position:relative;">
          <input type="password" id="newLockPasswordInput" style="width:100%;padding-right:40px;box-sizing:border-box;" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <button type="button" id="newLockToggleVisibility" aria-label="合言葉を表示" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:6px;color:var(--sumi-soft);font-size:16px;line-height:1;">👁</button>
        </div>
      </div>
      <div class="field-row">
        <label>もう一度入力してください</label>
        <div style="position:relative;">
          <input type="password" id="newLockPasswordConfirmInput" style="width:100%;padding-right:40px;box-sizing:border-box;" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <button type="button" id="newLockToggleVisibilityConfirm" aria-label="合言葉を表示" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:6px;color:var(--sumi-soft);font-size:16px;line-height:1;">👁</button>
        </div>
      </div>
      <div id="newLockPasswordError" style="color:#a63446;font-size:12px;min-height:16px;margin-bottom:4px;"></div>
      <button class="btn btn-primary" id="changeLockPasswordBtn">合言葉を変更する</button>
    </div>
  `;

  [document.getElementById('newLockPasswordInput'), document.getElementById('newLockPasswordConfirmInput')].forEach(el=>{
    el.addEventListener('paste', (e)=> e.preventDefault());
    el.addEventListener('drop', (e)=> e.preventDefault());
  });

  document.getElementById('newLockToggleVisibility').onclick = ()=>{
    const inp = document.getElementById('newLockPasswordInput');
    const btn = document.getElementById('newLockToggleVisibility');
    const showing = inp.type === 'text';
    inp.type = showing ? 'password' : 'text';
    btn.textContent = showing ? '👁' : '🙈';
  };
  document.getElementById('newLockToggleVisibilityConfirm').onclick = ()=>{
    const inp = document.getElementById('newLockPasswordConfirmInput');
    const btn = document.getElementById('newLockToggleVisibilityConfirm');
    const showing = inp.type === 'text';
    inp.type = showing ? 'password' : 'text';
    btn.textContent = showing ? '👁' : '🙈';
  };

  document.getElementById('changeLockPasswordBtn').onclick = async ()=>{
    const val = document.getElementById('newLockPasswordInput').value.trim();
    const val2 = document.getElementById('newLockPasswordConfirmInput').value.trim();
    const errEl = document.getElementById('newLockPasswordError');
    if(!val || val.length < 4){ errEl.textContent = '4文字以上で入力してください'; return; }
    if(val !== val2){ errEl.textContent = '2つの入力が一致しません'; return; }
    errEl.textContent = '';
    const hash = await sha256Hex(val);
    localStorage.setItem(LOCK_PASSWORD_KEY, hash);
    document.getElementById('newLockPasswordInput').value = '';
    document.getElementById('newLockPasswordConfirmInput').value = '';
    doToast('合言葉を変更しました');
  };
}

// ---------- init ----------
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error('timeout')), ms))
  ]);
}

// ---------- password lock ----------
async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function startApp(){
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
  loadState();
}

async function initLock(){
  const savedHash = localStorage.getItem(LOCK_PASSWORD_KEY);
  const screen = document.getElementById('lockScreen');
  const input = document.getElementById('lockPasswordInput');
  const confirmWrap = document.getElementById('lockConfirmWrap');
  const confirmInput = document.getElementById('lockPasswordConfirmInput');
  const errorEl = document.getElementById('lockError');
  const btn = document.getElementById('lockSubmitBtn');
  const promptEl = document.getElementById('lockPromptText');

  // Block paste/drop into password fields so the password must be typed, not copied in.
  [input, confirmInput].forEach(el=>{
    el.addEventListener('paste', (e)=> e.preventDefault());
    el.addEventListener('drop', (e)=> e.preventDefault());
    el.addEventListener('contextmenu', (e)=> e.preventDefault());
  });

  if(!savedHash){
    // First time: let the user set a password (typed twice to confirm)
    promptEl.textContent = '合言葉を設定してください（次回から必要になります）';
    confirmWrap.style.display = '';
    btn.textContent = '設定する';
    btn.onclick = async ()=>{
      const val = input.value.trim();
      const val2 = confirmInput.value.trim();
      if(!val || val.length < 4){
        errorEl.textContent = '4文字以上で設定してください';
        return;
      }
      if(val !== val2){
        errorEl.textContent = '2つの入力が一致しません';
        return;
      }
      const hash = await sha256Hex(val);
      localStorage.setItem(LOCK_PASSWORD_KEY, hash);
      startApp();
    };
  } else {
    confirmWrap.style.display = 'none';
    btn.onclick = async ()=>{
      const val = input.value.trim();
      const hash = await sha256Hex(val);
      if(hash === savedHash){
        startApp();
      } else {
        errorEl.textContent = '合言葉が違います';
        input.value = '';
      }
    };
  }
  input.onkeydown = (e)=>{ if(e.key==='Enter') btn.onclick(); };
  confirmInput.onkeydown = (e)=>{ if(e.key==='Enter') btn.onclick(); };
  input.focus();

  function wireToggle(toggleId, targetInput){
    const toggleBtn = document.getElementById(toggleId);
    toggleBtn.onclick = ()=>{
      const showing = targetInput.type === 'text';
      targetInput.type = showing ? 'password' : 'text';
      toggleBtn.textContent = showing ? '👁' : '🙈';
      toggleBtn.setAttribute('aria-label', showing ? '合言葉を表示' : '合言葉を隠す');
      targetInput.focus();
    };
  }
  wireToggle('lockToggleVisibility', input);
  wireToggle('lockToggleVisibilityConfirm', confirmInput);
}

initLock();
</script>
